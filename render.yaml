# TradeHive Social v2 on Render. One container runs nginx + php-fpm + Reverb
# (websockets proxied at /app) + Horizon (queues) + the scheduler; see
# docker/supervisord.prod.conf. Database: Supabase Postgres. Media: Cloudflare R2.
# Values marked `sync: false` are secrets: set them in the Render dashboard only.
services:
  - type: web
    name: tradehive-social-v2
    runtime: docker
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    dockerCommand: ""
    plan: standard            # 2 GB RAM for nginx, php-fpm, Reverb, Horizon, scheduler
    region: oregon
    branch: v2
    autoDeploy: false          # deploy only after CI passes
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: TradeHive Social
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://social.tradehiveagency.com
      - key: APP_KEY
        sync: false
      - key: SELF_HOSTED
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: TELESCOPE_ENABLED
        value: "false"
      - key: TRUSTED_PROXIES
        value: "*"             # Render's load balancer sits in front of the app
      - key: LEGAL_TERMS_URL
        value: https://social.tradehiveagency.com/terms
      - key: LEGAL_PRIVACY_URL
        value: https://social.tradehiveagency.com/privacy
      # Database (Supabase session pooler, port 5432)
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      # Redis (Render Key Value)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tradehive-social-redis
          property: connectionString
      - key: QUEUE_CONNECTION
        value: redis
      - key: CACHE_STORE
        value: redis
      - key: SESSION_DRIVER
        value: database
      - key: BROADCAST_CONNECTION
        value: reverb
      - key: REVERB_APP_ID
        sync: false
      - key: REVERB_APP_KEY
        sync: false
      - key: REVERB_APP_SECRET
        sync: false
      - key: REVERB_HOST
        value: social.tradehiveagency.com
      - key: REVERB_PORT
        value: "443"
      - key: REVERB_SCHEME
        value: https
      # Media storage (Cloudflare R2)
      - key: FILESYSTEM_DISK
        value: r2
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        value: tradehive-social-media
      - key: R2_URL
        sync: false
      # Email (Resend SMTP; tradehiveagency.com is verified in Resend)
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.resend.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: resend
      - key: MAIL_PASSWORD
        sync: false            # the Resend API key
      - key: MAIL_SCHEME
        value: smtp
      - key: MAIL_FROM_ADDRESS
        value: noreply@tradehiveagency.com
      - key: MAIL_FROM_NAME
        value: TradeHive Social
      # OAuth / MCP keys (php artisan passport:keys, pasted with \n newlines)
      - key: PASSPORT_PRIVATE_KEY
        sync: false
      - key: PASSPORT_PUBLIC_KEY
        sync: false
      # Billing
      - key: STRIPE_KEY
        sync: false
      - key: STRIPE_SECRET
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Social networks (callbacks: https://social.tradehiveagency.com/accounts/<network>/callback)
      - key: FACEBOOK_CLIENT_ID
        value: "1450340993955649"
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: INSTAGRAM_CLIENT_ID
        sync: false
      - key: INSTAGRAM_CLIENT_SECRET
        sync: false
      - key: THREADS_CLIENT_ID
        sync: false
      - key: THREADS_CLIENT_SECRET
        sync: false
      - key: TIKTOK_CLIENT_ID
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: PINTEREST_CLIENT_ID
        sync: false
      - key: PINTEREST_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_REDIRECT
        value: https://social.tradehiveagency.com/accounts/facebook/callback
      - key: INSTAGRAM_CLIENT_REDIRECT
        value: https://social.tradehiveagency.com/accounts/instagram/callback
      - key: THREADS_CLIENT_REDIRECT
        value: https://social.tradehiveagency.com/accounts/threads/callback
      - key: TIKTOK_CLIENT_REDIRECT
        value: https://social.tradehiveagency.com/accounts/tiktok/callback
      - key: LINKEDIN_CLIENT_REDIRECT
        value: https://social.tradehiveagency.com/accounts/linkedin/callback
      - key: GOOGLE_CLIENT_REDIRECT
        value: https://social.tradehiveagency.com/accounts/youtube/callback
      - key: GOOGLE_AUTH_CALLBACK
        value: https://social.tradehiveagency.com/auth/google/callback
      - key: GOOGLE_BUSINESS_CLIENT_REDIRECT
        value: https://social.tradehiveagency.com/accounts/google-business/callback
      - key: PINTEREST_CLIENT_REDIRECT
        value: https://social.tradehiveagency.com/accounts/pinterest/callback
      - key: DISCORD_CLIENT_REDIRECT
        value: https://social.tradehiveagency.com/accounts/discord/callback
      - key: GOOGLE_BUSINESS_CLIENT_ID
        sync: false
      - key: GOOGLE_BUSINESS_CLIENT_SECRET
        sync: false
      # AI writing assistant
      - key: OPENAI_API_KEY
        sync: false

  - type: keyvalue
    name: tradehive-social-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: noeviction   # queues must never be evicted
    ipAllowList: []               # private network only
